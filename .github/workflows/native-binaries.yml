name: Native plugin binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-native-plugin:
    name: Build native plugin (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            plugin_dir: Assets/Plugins/Linux
            release_cmake_args: ""
          - name: macos-arm64
            os: macos-14
            plugin_dir: Assets/Plugins/macOS
            release_cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64"
          - name: windows-x64
            os: windows-2022
            plugin_dir: Assets/Plugins/Windows/x86_64
            release_cmake_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        if: runner.os != 'Windows'
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Set up MSVC developer shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure native tests
        if: runner.os != 'Windows'
        run: >-
          nix develop --command cmake
          -S Native/drone-navigation-native
          --preset tests
          -B Native/drone-navigation-native/build-ci-tests
          -DCMAKE_BUILD_TYPE=Release

      - name: Build native tests
        if: runner.os != 'Windows'
        run: nix develop --command cmake --build Native/drone-navigation-native/build-ci-tests --parallel

      - name: Run native tests
        if: runner.os != 'Windows'
        run: nix develop --command ctest --test-dir Native/drone-navigation-native/build-ci-tests --output-on-failure

      - name: Configure native tests (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S Native/drone-navigation-native
          -B Native/drone-navigation-native/build-ci-tests
          -G "Visual Studio 17 2022" -A x64
          -DENABLE_TESTING=ON -DENABLE_INSTALL=OFF

      - name: Build native tests (Windows)
        if: runner.os == 'Windows'
        run: cmake --build Native/drone-navigation-native/build-ci-tests --config Release --parallel

      - name: Run native tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir Native/drone-navigation-native/build-ci-tests -C Release --output-on-failure

      - name: Configure native release build
        if: runner.os != 'Windows'
        run: nix develop --command cmake -S Native/drone-navigation-native --preset release ${{ matrix.release_cmake_args }}

      - name: Build and stage Unity plugin with dn-unity-plugin
        if: runner.os != 'Windows'
        run: nix develop --command dn-unity-plugin

      - name: Configure native release build (Windows)
        if: runner.os == 'Windows'
        run: cmake -S Native/drone-navigation-native --preset release -G "Visual Studio 17 2022" -A x64

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        run: cmake --build Native/drone-navigation-native/build --config Release

      - name: Stage Unity plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Assets/Plugins/Windows/x86_64 | Out-Null
          $candidates = @(
            'Native/drone-navigation-native/build/src/Release/drone_algo.dll',
            'Native/drone-navigation-native/build/src/Release/libdrone_algo.dll',
            'Native/drone-navigation-native/build/src/drone_algo.dll',
            'Native/drone-navigation-native/build/src/libdrone_algo.dll'
          )
          $dll = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dll) {
            Write-Error 'No Windows native plugin DLL was produced.'
            exit 1
          }
          Copy-Item $dll Assets/Plugins/Windows/x86_64/drone_algo.dll -Force

      - name: Upload staged Unity plugin
        uses: actions/upload-artifact@v4
        with:
          name: drone-navigation-native-${{ matrix.name }}
          path: ${{ matrix.plugin_dir }}
          if-no-files-found: error
